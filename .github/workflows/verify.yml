name: Lean certificate verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Replay independent Python checks
        run: python3 certificates/verify_family.py

      - name: Check reproducibility of Lean certificate sources
        run: |
          python3 generate_lean_certificates.py --ks 4,5,6,7,8,9
          git diff --exit-code -- CertificateK4.lean CertificateK5.lean CertificateK6.lean CertificateK7.lean CertificateK8.lean CertificateK9.lean

      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
